<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
        <title th:text="'マイ本棚_'+${application.website.name}"></title>
        <meta name="keywords" th:content="'マイ本棚,マイページ,'+${application.website.name}+'小説,'+${application.website.name}"/>
        <meta name="description"
              th:content="${application.website.name}+'小説は毎日更新の小説連載、小説ランキングを提供。恋愛小説、都市小説、ファンタジー小説、タイムスリップ小説、青春小説、御曹司・財閥小説、ネット小説、無料小説、全本小説、初掲載小説、最新話無料小説の読書は'+${application.website.name}+'小説へ！'"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="common/top :: top('')">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1 " href="/user/userinfo.html">マイページ</a></li>
                <li th:if="${isAuthor}"><a class="link_9 " href="/author/index.html">作品管理</a></li>
                <li><a class="link_4 on" href="/user/favorites.html">マイ本棚</a></li>
                <li><a class="link_6 " href="/user/comment.html">マイレビュー</a></li>
                <li><a class="link_7 " href="/user/feedback_list.html">マイフィードバック</a></li>
                <li><a class="link_8 " href="/user/setup.html">アカウント設定</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl"><a href="javascript:void(0);" class="red">マイ本棚</a></h2><i
                        class="fl ml20 mr20 font16">|</i>
                    <h2 class="fl"><a href="/user/read_history.html">最近読んだ本</a></h2>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="style">
                                ジャンル
                            </th>
                            <th class="name">
                                書名
                            </th>
                            <th class="chapter">
                                最新話
                            </th>
                            <th class="time">
                                更新時間
                            </th>
                            <th class="goread">
                                操作
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookShelfList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>


</body>
<div th:replace="common/js :: js"></div>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
    search(1, 10);

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/user/listBookShelfByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookShelfList = data.data.list;
                    if (bookShelfList.length > 0) {
                        var bookShelfListHtml = "";
                        for (var i = 0; i < bookShelfList.length; i++) {
                            var book = bookShelfList[i];
                            bookShelfListHtml += (" <tr id='shelf" + book.bookId + "' class=\"book_list\" vals=\"291\">\n" +
                                "                            <td class=\"style bookclass\">\n" +
                                "                                <a href=\"/book/bookclass.html?c=" + book.catId + "\" >[" + book.catName + "]</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"name\">\n" +
                                "                                <a href=\"/book/" + book.bookId + ".html\">\n" +
                                "                                    " + book.bookName + "</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"chapter\" valsc=\"291|2037554|1\">\n" +
                                "<a href='/book/" + book.bookId + "/" + book.lastIndexId + ".html'>" + book.lastIndexName + "</a>" +
                                "                            </td>\n" +
                                "                            <td class=\"time\">\n" +
                                "                                " + book.lastIndexUpdateTime + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "<div style=''><a href='/book/" + book.bookId + "/" + book.preContentId + ".html'>続きを読む</a></div>" +
                                "<div style='line-height:8px;padding-bottom:13px'><a href='javascript:removeFromBookShelf(\"" + book.bookId + "\")'>本棚から削除</a></div>" +
                                "                            </td>\n" +
                                "                        </tr>");
                        }
                        $("#bookShelfList").html(bookShelfListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            //laypageインスタンスを実行
                            laypage.render({
                                elem: 'shellPage' //注意：ここは ID。# は付けない # 号
                                , count: data.data.total //データ総数。サーバーから取得,
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    //objには現在のページの全パラメータが含まれる。例：
                                    console.log(obj.curr); //現在のページを取得し、サーバーに該当ページのデータを要求。
                                    console.log(obj.limit); //1ページあたりの表示件数を取得


                                    //初回は実行しない
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    //未ログイン
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    }

    function removeFromBookShelf(bookId) {

        $.ajax({
            type: "delete",
            url: "/user/removeFromBookShelf/" + bookId,
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#shelf" + bookId).remove();
                }
            }
        });

    }
</script>
</html>
