<div th:fragment="top(navType)" class="header">
    <div class="topMain">
        <div class="box_center cf">
            <a href="/" class="logo fl">
                <span class="logo-text" th:text="${application.website.name}"></span>
                <span class="logo-sub">小説はYomebaで読む</span>
            </a>
            <div class="searchBar fl">
                <div class="search cf">
                    <input type="text" placeholder="作品名、作家名、キーワードで探す" class="s_int" name="searchKey" id="searchKey"/>
                    <label class="search_btn" id="btnSearch" onclick="searchByK()"><i class="icon"></i></label>
                </div>
            </div>
            <div class="bookShelf fr" id="headerUserInfo">
                <span class="user_link">
                    <a href="/user/login.html" class="btn-login">ログイン</a>
                    <a href="/user/register.html" class="btn-free">無料登録</a>
                </span>
            </div>
        </div>
    </div>
    <div class="mainNav" id="mainNav" th:style="${navType} == 10?'display:none':''">
        <div class="box_center cf">
            <ul class="nav" id="navModule">
                <li th:class="${navType}==0?'on':''"><a href="/">ホーム</a></li>
                <li th:class="${navType}==2?'on':''"><a href="/book/book_ranking.html">ランキング</a></li>
                <li th:class="${navType}==1?'on':''"><a href="/book/bookclass.html">ジャンル</a></li>
            </ul>
        </div>
    </div>
</div>
