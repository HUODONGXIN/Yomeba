<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title th:text="${application.website.name}"></title>

    <meta name="keywords" th:content="${application.website.keyword}"/>
    <meta name="description" th:content="${application.website.description}"/>

    <div th:include="mobile/common/css :: css"></div>

    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; max-width: 100%; overflow-x: hidden; }
        body { margin: 0; background: #fff; color: #222; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }

        /* ---- header ---- */
        .m-header { width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 10px 12px 8px; gap: 8px; }
        .m-logo { flex: none; font-size: 20px; font-weight: 800; color: #3FBDFD; text-decoration: none; line-height: 1.1; }
        .m-logo small { display: block; font-size: 8px; color: #9aa0a6; font-weight: 400; margin-top: 2px; letter-spacing: .5px; }
        .m-actions { display: flex; align-items: center; margin-left: auto; }
        .m-login { font-size: 12px; color: #333; margin-right: 9px; white-space: nowrap; text-decoration: none; }
        .m-register { background: #111; color: #fff; font-size: 11px; padding: 8px 10px; white-space: nowrap; border-radius: 3px; text-decoration: none; }

        /* ---- search ---- */
        .m-search { position: relative; margin: 4px 14px 10px; }
        .m-search input { width: 100%; height: 42px; background: #f1f1f1; border: none; border-radius: 6px; padding: 0 44px 0 40px; font-size: 14px; outline: none; }
        .m-search .ic { position: absolute; left: 13px; top: 13px; width: 16px; height: 16px; border: 2px solid #999; border-radius: 50%; }
        .m-search .ic::after { content: ""; position: absolute; right: -5px; bottom: -3px; width: 7px; height: 2px; background: #999; transform: rotate(45deg); }
        .m-search .go { position: absolute; right: 10px; top: 10px; font-size: 13px; color: #3FBDFD; background: none; border: none; }

        /* ---- nav ---- */
        .m-nav { width: 100%; display: flex; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #eee; padding: 0 6px; scrollbar-width: none; }
        .m-nav::-webkit-scrollbar { display: none; }
        .m-nav a { flex: none; padding: 11px 8px 10px; font-size: 12.5px; color: #666; text-decoration: none; position: relative; }
        .m-nav a.on { color: #111; font-weight: 700; }
        .m-nav a.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; background: #3FBDFD; }

        /* ---- hero ---- */
        .m-rail { width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; background: #6d6d6d; scrollbar-width: none; }
        .m-rail::-webkit-scrollbar { display: none; }
        .m-track { display: flex; gap: 12px; padding: 10px 11vw; }
        .m-slide { flex: 0 0 78vw; width: 78vw; height: calc(78vw * 0.441); scroll-snap-align: center; border-radius: 4px; overflow: hidden; text-decoration: none; display: flex; flex-direction: column; justify-content: center; padding: 0 20px; box-sizing: border-box; color: #fff; }
        .m-slide { padding: 0; background-position: center; background-size: cover; background-repeat: no-repeat; }
        .m-slide-1 { background-image: url(/images/banner/hero-1.jpg); }
        .m-slide-2 { background-image: url(/images/banner/hero-6.jpg); }
        .m-slide-3 { background-image: url(/images/banner/hero-3.jpg); }
        .m-slide-4 { background-image: url(/images/banner/hero-4.jpg); }
        .m-slide-5 { background-image: url(/images/banner/hero-2.jpg); }
        .m-slide strong { font-size: 17px; line-height: 1.35; font-weight: 700; }
        .m-slide span { font-size: 11px; line-height: 1.6; margin-top: 7px; opacity: .92; }

        /* ---- campaign ---- */
        .m-campaign { margin: 16px 14px 6px; background: #e9e9e9; border-radius: 4px; padding: 16px; }
        .m-campaign strong { display: block; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .m-campaign span { font-size: 12px; color: #555; line-height: 1.6; }
        .m-campaign-btn { display: block; margin-top: 14px; background: #3FBDFD; color: #fff; text-align: center; height: 44px; line-height: 44px; border-radius: 4px; font-size: 14px; font-weight: 700; text-decoration: none; }

        /* ---- sections ---- */
        .m-sec { padding: 20px 14px 6px; }
        .m-sec h2 { font-size: 20px; font-weight: 800; margin: 0 0 14px; padding-left: 11px; position: relative; letter-spacing: .5px; }
        .m-sec h2::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; background: #111; }
        .m-sec .more { float: right; font-size: 11px; color: #888; font-weight: 400; text-decoration: none; margin-top: 8px; }

        .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 10px; }
        .m-card { display: block; text-decoration: none; color: #222; }
        .m-cover { width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; background: #eee; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; line-height: 1.35; text-align: center; padding: 8px; }
        .m-cover img { width: 100%; height: 100%; object-fit: cover; }
        .m-card .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; margin-top: 6px; line-height: 1.45; }

        .m-list .row { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f1f1; text-decoration: none; color: #222; }
        .m-list .num { flex: none; width: 20px; font-size: 13px; font-weight: 700; color: #3FBDFD; }
        .m-list .txt { min-width: 0; }
        .m-list .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .m-news { list-style: none; padding: 0; margin: 0; }
        .m-news li { padding: 9px 0; border-bottom: 1px solid #f1f1f1; font-size: 12.5px; display: flex; gap: 8px; }
        .m-news li a { color: #222; text-decoration: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .m-news li span { color: #999; font-size: 11px; flex: none; }
        .m-list .meta { font-size: 11px; color: #999; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>

</head>
<body>

<header class="m-header">
    <a href="/" class="m-logo">
        Yomeba
        <small>小説はYomebaで読む</small>
    </a>
    <div class="m-actions">
        <a href="/user/login.html" class="m-login">ログイン</a>
        <a href="/user/register.html" class="m-register">無料登録</a>
    </div>
</header>

<div class="m-search">
    <span class="ic"></span>
    <input id="title" type="text" placeholder="作品名、作家名、キーワードで探す" autocomplete="off"/>
    <button class="go" type="button" onclick="searchBooks()">検索</button>
</div>

<nav class="m-nav">
    <a class="on" href="/">ホーム</a>
    <a href="/book/book_ranking.html">ランキング</a>
    <a href="/book/bookclass.html">ジャンル</a>
</nav>

<div class="m-rail" id="mRail">
    <div class="m-track">
        <a class="m-slide m-slide-1" href="/user/register.html" aria-label="キャンペーン"></a>
        <a class="m-slide m-slide-2" href="/user/register.html" aria-label="無料会員登録"></a>
        <a class="m-slide m-slide-3" href="/book/book_ranking.html" aria-label="ランキング"></a>
        <a class="m-slide m-slide-4" href="/book/bookclass.html?c=7" aria-label="女性向け"></a>
        <a class="m-slide m-slide-5" href="/book/bookclass.html?c=1" aria-label="男性向け"></a>
    </div>
</div>

<section class="m-campaign">
    <div>
        <strong>新規登録キャンペーン実施中！</strong>
        <span>今すぐ登録で全作品が読み放題。人気の異世界、悪役令嬢、転生ものを無料で楽しめます。</span>
    </div>
    <a class="m-campaign-btn" href="/user/register.html">無料で始める →</a>
</section>

<section class="m-sec">
    <h2>いま読むべき旬の作品！<a class="more" href="/book/book_ranking.html">もっと見る</a></h2>
    <div class="m-grid" id="mWeek"></div>
</section>

<section class="m-sec">
    <h2>新作小説<a class="more" href="/book/book_ranking.html?type=1">もっと見る</a></h2>
    <div class="m-grid" id="mNew"></div>
</section>

<section class="m-sec">
    <h2>人気急上昇！<a class="more" href="/book/book_ranking.html">もっと見る</a></h2>
    <div class="m-grid" id="mRising"></div>
</section>

<section class="m-sec">
    <h2>おすすめ！<a class="more" href="/book/bookclass.html">もっと見る</a></h2>
    <div class="m-grid" id="mRecommend"></div>
</section>

<section class="m-sec">
    <h2>今月のおすすめ＆新刊！<a class="more" href="/book/book_ranking.html?type=1">もっと見る</a></h2>
    <div class="m-grid" id="mMonthly"></div>
</section>

<section class="m-sec">
    <h2>【短編】人気＆おすすめ<a class="more" href="/book/bookclass.html">もっと見る</a></h2>
    <div class="m-grid" id="mShort"></div>
</section>

<section class="m-sec">
    <h2>今話題の準新作！<a class="more" href="/book/book_ranking.html">もっと見る</a></h2>
    <div class="m-grid" id="mSemi"></div>
</section>

<section class="m-sec">
    <h2>男性向け<a class="more" href="/book/bookclass.html?c=1">もっと見る</a></h2>
    <div class="m-grid" id="mMale"></div>
</section>

<section class="m-sec">
    <h2>女性向け<a class="more" href="/book/bookclass.html?c=7">もっと見る</a></h2>
    <div class="m-grid" id="mFemale"></div>
</section>

<section class="m-sec">
    <h2>お知らせ</h2>
    <ul class="m-news" id="mNews">
        <li th:each="news : ${newsList}">
            <a th:href="'/about/newsInfo-'+${news.id}+'.html'" th:utext="${news.title}"></a>
            <span th:if="${news.createTime != null}" th:text="${#dates.format(news.createTime,'yyyy-MM-dd')}"></span>
        </li>
    </ul>
</section>

<div th:replace="mobile/common/footer :: footer"></div>
<div th:replace="mobile/common/js :: js"></div>

<script src="/mobile/js/wap_collect.js"></script>

<script>
    var COVER_COLORS = [
        ['#7C4DFF', '#5E35B1'], ['#43A047', '#2E7D32'], ['#29B6F6', '#0288D1'],
        ['#EF5350', '#C62828'], ['#FFA726', '#EF6C00'], ['#EC407A', '#AD1457']
    ];

    function coverHtml(book, i) {
        var name = book.bookName || '';
        var pic = book.picUrl || '';
        if (pic && pic.indexOf('default.gif') === -1) {
            return '<div class="m-cover"><img src="' + pic + '" alt=""/></div>';
        }
        var c = COVER_COLORS[i % COVER_COLORS.length];
        return '<div class="m-cover" style="background:linear-gradient(135deg,' + c[0] + ',' + c[1] + ')">' + name + '</div>';
    }

    function cardHtml(book, i) {
        return '<a class="m-card" href="/book/' + book.id + '.html">' +
            coverHtml(book, i) +
            '<span class="t">' + (book.bookName || '') + '</span>' +
            '</a>';
    }

    function loadGrid(url, target) {
        $.ajax({
            type: 'get', url: url, data: {}, dataType: 'json',
            success: function (data) {
                if (data.code == 200 && data.data && data.data.length) {
                    var html = '';
                    for (var i = 0; i < data.data.length && i < 6; i++) {
                        html += cardHtml(data.data[i], i);
                    }
                    $(target).html(html);
                }
            }
        });
    }

    function renderGrid(list, target, max) {
        var html = '';
        for (var i = 0; i < list.length && i < (max || 6); i++) {
            html += cardHtml(list[i], i);
        }
        $(target).html(html || '<p style="color:#999;font-size:12px;padding:8px 0">該当作品はまだありません</p>');
    }

    function loadGrid(url, target) {
        $.ajax({
            type: 'get', url: url, data: {}, dataType: 'json',
            success: function (data) {
                if (data.code == 200 && data.data) renderGrid(data.data, target, 6);
            }
        });
    }

    $(function () {
        loadGrid('/book/listClickRank', '#mWeek');
        loadGrid('/book/listNewRank', '#mNew');
        loadGrid('/book/listUpdateRank', '#mRising');
        loadGrid('/book/listUpdateRank', '#mRecommend');
        loadGrid('/book/listNewRank', '#mMonthly');
        loadGrid('/book/listUpdateRank', '#mSemi');

        // 短編
        $.ajax({
            type: 'get', url: '/book/listClickRank', data: {}, dataType: 'json',
            success: function (data) {
                if (data.code != 200) return;
                var all = data.data || [];
                var shorts = all.filter(function (b) { return b.wordCount && b.wordCount < 20000; });
                renderGrid(shorts.length ? shorts : all, '#mShort', 6);
            }
        });

        // 男性向け / 女性向け
        var catDir = {}, allBooks = [];
        function fillGender() {
            if (!allBooks.length) return;
            ['male', 'female'].forEach(function (k) {
                var ids = {};
                Object.keys(catDir).forEach(function (id) { if (catDir[id] === k) ids[id] = 1; });
                var list = allBooks.filter(function (b) {
                    return String(b.catId || '').split(',').some(function (x) { return ids[x]; });
                });
                renderGrid(list, '#m' + k.charAt(0).toUpperCase() + k.slice(1), 6);
            });
        }
        $.ajax({
            type: 'get', url: '/book/listBookCategory', data: {}, dataType: 'json',
            success: function (d) {
                if (d.code == 200) {
                    (d.data || []).forEach(function (c) { catDir[String(c.id)] = (c.workDirection == 1 ? 'female' : 'male'); });
                    fillGender();
                }
            }
        });
        $.ajax({
            type: 'get', url: '/book/searchByPage', data: {pageNum: 1, pageSize: 50}, dataType: 'json',
            success: function (d) {
                if (d.code == 200 && d.data && d.data.list) { allBooks = d.data.list; fillGender(); }
            }
        });
    });

    function searchBooks() {
        var keywords = $('#title').val();
        window.location.href = '/book/book_ranking.html?keyword=' + encodeURI(keywords);
    }

    function moreNewBooks() {
        window.location.href = '/book/book_ranking.html?sortBy=last_index_update_time';
    }

    function toMyCollect() {
        var token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/book/book_ranking.html?token=' + token;
        } else {
            window.location.href = '/user/login.html';
        }
    }

    // ヒーローレールを5枚で無限ループ（前後に複製を置いて端の空白を防ぐ）
    (function () {
        var rail = document.getElementById('mRail');
        if (!rail) return;
        var track = rail.querySelector('.m-track');
        var kids = track.children;
        if (kids.length < 2) return;
        track.insertBefore(kids[kids.length - 1].cloneNode(true), kids[0]);
        track.appendChild(track.children[1].cloneNode(true));
        function center() {
            var card = track.children[1];
            rail.scrollLeft = card.offsetLeft - (rail.clientWidth - card.offsetWidth) / 2;
        }
        window.addEventListener('load', center);
        center();
    })();
</script>

</body>
</html>
