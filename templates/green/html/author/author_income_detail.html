<script language="javascript" type="text/javascript">
    var bookId = getSearchString("bookId");
    search(1, 10);

    function search(curr, limit) {

        var data = {'curr': curr, 'limit': limit};

        if (bookId) {
            data.bookId = bookId;
        }

        $.ajax({
            type: "get",
            url: "/author/listIncomeDailyByPage",
            data: data,
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    if (bookList.length > 0) {
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            bookListHtml += (" <tr class=\"book_list\" >\n" +
                                "                            <td class=\"goread\">\n" +
                                "                                " + book.incomeDate + "</td>\n" +
                                "                            <td class=\"goread\" >"
                                + book.incomeAccount + "</td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "                                " + book.incomeCount + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">" + book.incomeNumber +
                                "                            </td>\n" +

                                " </tr>");
                        }
                        $("#bookList").html(bookListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            //laypageインスタンスを実行
                            laypage.render({
                                elem: 'shellPage' //注意：ここは ID。# は付けない # 号
                                , count: data.data.total //データ総数。サーバーから取得,
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    //objには現在のページの全パラメータが含まれる。例：
                                    console.log(obj.curr); //現在のページを取得し、サーバーに該当ページのデータを要求。
                                    console.log(obj.limit); //1ページあたりの表示件数を取得


                                    //初回は実行しない
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    //未ログイン
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    }


    function updateBookStatus(bookId, status) {

        $.ajax({
            type: "POST",
            url: "/author/updateBookStatus",
            data: {'bookId': bookId, 'status': status == 0 ? 1 : 0},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    location.reload();


                } else if (data.code == 1001) {
                    //未ログイン
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })


    }
</script>
