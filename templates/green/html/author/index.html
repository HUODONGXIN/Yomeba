<script language="javascript" type="text/javascript">
    var coverUpdateInterval;

    search(1, 5);

    function search(curr, limit) {
        clearInterval(coverUpdateInterval);
        $.ajax({
            type: "get",
            url: "/author/listBookByPage",
            data: { 'curr': curr, 'limit': limit },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    if (bookList.length > 0) {
                        if (curr == 1 && bookList[0].picUrl == '/images/default.gif') {
                            coverUpdateInterval = setInterval(function () {
                                $.ajax({
                                    type: "get",
                                    url: "/author/queryAiGenPic",
                                    data: { 'bookId': bookList[0].id },
                                    dataType: "json",
                                    success: function (data) {
                                        if (data.code == 200 && data.data) {
                                            $("#cover" + bookList[0].id).attr("src", data.data);
                                            clearInterval(coverUpdateInterval);
                                        }
                                    }
                                });
                            }, 3000);
                            setTimeout(() => {
                                clearInterval(coverUpdateInterval);
                            }, 10000);
                        }
                        $("#hasContentDiv").css("display", "block");
                        $("#noContentDiv").css("display", "none");
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            bookListHtml += (" <tr class=\"book_list\" vals=\"291\">\n" +
                                /* "                            <td class=\"style bookclass\">\n" +
                                 "                                ["+(i+1)+"]\n" +
                                 "                            </td>\n" +*/

                                "                            <td style=\"position: relative\" class=\"goread\">\n" +
                                "<input class=\"opacity\" onchange=\"picChange('" + book.id + "')\"\n" +
                                "                                           type=\"file\" id=\"file" + book.id + "\" name=\"file\"\n" +
                                "                                           title=\"画像をクリックしてアップロード\"\n" +
                                "                                           style=\"z-index: 100;cursor: pointer;left: 30px; top: 0px; width: 60px; height: 80px; opacity: 0; position: absolute;  \"\n" +
                                "                                    />" +
                                "<div style='display:flex;align-items:flex-start;'>" +
                                "<img id=\"cover" + book.id + "\" width='50' height='70' src='" + book.picUrl + "' style='flex-shrink:0;'/>" +
                                "<div style='margin-left:12px;text-align:left;'>" +
                                "<div style='font-size:16px;font-weight:bold;color:#333;line-height:1.4;'>" + book.bookName + "</div>" +
                                "</div></div></td>\n" +
                                "                            <td class=\"goread\" >"
                                + book.catName + "</td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + book.visitCount + "</td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + book.yesterdayBuy + "</td>\n" +

                                "                            <td class=\"goread\">\n" +
                                "                                " + new Date(Date.parse(book.lastIndexUpdateTime ? book.lastIndexUpdateTime : book.updateTime)).Format("yyyy-MM-dd hh:mm") + "更新\n" +
                                "                            </td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + book.wordCount + "</td>\n" +

                                " <td class=\"goread\">" + (book.status == 1 ? '公開' : '非公開') + "</td>\n" +

                                " <td class=\"goread\">" + (book.bookStatus == 1 ? '完結' : '連載中') + "</td>\n" +

                                " <td class=\"goread\" id='opt" + book.id + "'>" +
                                "<a class='redBtn' href='/author/book_edit.html?bookId=" + book.id + "'>編集</a>" +
                                "</td>                     </tr>");
                        }
                        $("#bookList").html(bookListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            //laypageインスタンスを実行
                            laypage.render({
                                elem: 'shellPage' //注意：ここは ID。# は付けない # 号
                                , count: data.data.total //データ総数。サーバーから取得,
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    //objには現在のページの全パラメータが含まれる。例：
                                    console.log(obj.curr); //現在のページを取得し、サーバーに該当ページのデータを要求。
                                    console.log(obj.limit); //1ページあたりの表示件数を取得


                                    //初回は実行しない
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    //未ログイン
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    }



    function picChange(bookId) {
        var file = $("#file" + bookId).val(); //ファイル名
        if (file != "") {
            if (checkPicUpload($("#file" + bookId)[0])) {

                $.ajaxFileUpload({
                    url: "/file/picUpload", //ファイルアップロード用サーバーリクエストURL
                    secureuri: false, //セキュリティプロトコルが必要かどうか。通常はfalse
                    fileElementId: "file" + bookId, //ファイルアップロードフィールドのID
                    dataType: "json", //戻り値の型。通常はjson
                    type: "post",
                    success: function (data) { //サーバー成功応答処理関数
                        if (data.code == 200) {
                            let picUrl = data.data;
                            $.ajax({
                                type: "POST",
                                url: "/author/updateBookPic",
                                data: { 'bookId': bookId, 'bookPic': data.data },
                                dataType: "json",
                                success: function (data) {
                                    if (data.code == 200) {
                                        $("#cover" + bookId).attr("src", picUrl);
                                    } else {
                                        layer.alert(data.msg);
                                    }

                                },
                                error: function () {
                                    layer.alert('ネットワークエラー');
                                }
                            })

                        } else {
                            layer.alert(data.msg);
                        }

                    }

                });
            }
        } else {
            alert("アップロードするファイルを選択してください！");
        }


    }
</script>
