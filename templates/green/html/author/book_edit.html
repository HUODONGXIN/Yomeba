<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>作品編集-Yomeba</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <style type="text/css">
        .redBtn { padding: 5px 16px; border-radius: 20px; border: 1px solid #3eaf7c; background: #3eaf7c; color: #fff; }
        a.redBtn:hover { color: #fff; }
        .card { background:#fff; border-radius:10px; padding:24px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
        .card-title { font-size:16px; font-weight:bold; margin-bottom:18px; color:#222; }
        .edit-layout { display:flex; gap:24px; }
        .edit-cover { position:relative; flex-shrink:0; width:108px; }
        .edit-cover img { width:108px; height:150px; border-radius:6px; object-fit:cover; display:block; }
        .edit-cover .cover-tip { font-size:12px; color:#aaa; text-align:center; margin-top:8px; }
        .edit-cover input { position:absolute; top:0; left:0; width:108px; height:150px; opacity:0; cursor:pointer; z-index:10; }
        .edit-form { flex:1; min-width:0; }
        .form-row { display:flex; gap:20px; }
        .form-col { flex:1; }
        .form-item { margin-bottom:16px; }
        .form-item b { display:block; margin-bottom:6px; color:#333; font-size:13px; }
        .s_input { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid #e0e0e0; border-radius:6px; }
            .my_r .s_input { width:100%; }
        textarea.textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid #e0e0e0; border-radius:6px; }
        .card-toolbar { position:sticky; top:0; background:#fff; padding-bottom:12px; margin-bottom:8px; border-bottom:1px solid #f0f0f0; z-index:5; }
        .bottom-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; padding:12px 0; text-align:center; box-shadow:0 -2px 8px rgba(0,0,0,.05); z-index:100; }
        .bottom-bar .btn-main { background:#3eaf7c; color:#fff; border:none; padding:10px 48px; border-radius:24px; font-size:15px; cursor:pointer; margin-right:16px; }
        .bottom-bar .btn-ghost { background:#f5f5f5; color:#555; border:1px solid #ddd; padding:10px 24px; border-radius:24px; font-size:14px; cursor:pointer; }
        .catCb-label { display:inline-block; margin:0 14px 6px 0; font-size:13px; }
        #LabErr { color:#e74c3c; font-size:13px; }
    </style>
</head>
<body class="">

<div th:replace="common/top :: top('')">
    <div class="header">
        <div class="mainNav" id="mainNav">
            <div class="box_center cf"
                 style="text-align: center;height: 44px;line-height: 48px;color: #fff;font-size: 16px;">
                Yomeba著者管理
            </div>
        </div>
    </div>
</div>

<div class="main box_center cf" style="padding-bottom:80px;">
    <div class="userBox cf">
        <div class="my_l">
            <ul class="log_list">
                <li><a class="link_4 on" href="/author/index.html">作品管理</a></li>
                <li><a class="link_5" id="menuIndex" href="javascript:void(0)">話管理</a></li>
                <li><a class="link_2 " href="/author/author_income_detail.html">収入</a></li>
            </ul>
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf" style="margin-bottom:18px;">
                    <h2 class="fl">作品編集</h2>
                    <div class="fr">
                        <a href="/author/index.html" class="btn_red">作品管理に戻る</a>
                    </div>
                </div>

                <!-- 作品信息卡片 -->
                <div class="card">
                    <div class="card-title">作品基本情報</div>
                    <div class="edit-layout">
                        <div class="edit-cover">
                            <input type="file" id="coverFile" name="file" title="クリックしてカバーを変更"/>
                            <img id="coverImg" src=""/>
                            <div class="cover-tip">クリックで変更</div>
                        </div>
                        <div class="edit-form">
                            <div class="form-row">
                                <div class="form-col">
                                    <div class="form-item"><b>作品の方向性：</b>
                                        <select class="s_input" id="workDirection">
                                            <option value="0">男性向け</option>
                                            <option value="1">女性向け</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-col">
                                    <div class="form-item"><b>連載状態：</b>
                                        <select class="s_input" id="bookStatus">
                                            <option value="0">連載中</option>
                                            <option value="1">完結</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-item"><b>AI創作支援：</b>
                                        <select class="s_input" id="aiAssisted">
                                            <option value="0">いいえ（AI不使用）</option>
                                            <option value="1">はい（AI使用）</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="form-item"><b>ジャンル（最大3つまで）：</b>
                                <div>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="1" data-name="ファンタジー" onclick="catCheck(this)">ファンタジー</label>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="2" data-name="武侠仙侠" onclick="catCheck(this)">武侠仙侠</label>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="3" data-name="都市恋愛" onclick="catCheck(this)">都市恋愛</label>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="4" data-name="歴史・軍事" onclick="catCheck(this)">歴史・軍事</label>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="5" data-name="SF・オカルト" onclick="catCheck(this)">SF・オカルト</label>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="6" data-name="ゲーム・スポーツ" onclick="catCheck(this)">ゲーム・スポーツ</label>
                                    <label class="catCb-label"><input type="checkbox" class="catCb" value="7" data-name="女性向けチャンネル" onclick="catCheck(this)">女性向けチャンネル</label>
                                </div>
                                <span id="LabErr"></span>
                            </div>
                            <div class="form-item"><b>小説名：</b>
                                <input type="text" id="bookName" class="s_input"/>
                            </div>
                            <div class="form-item"><b>小説紹介：</b>
                                <textarea id="bookDesc" rows="5" class="textarea"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 底部固定操作栏 -->
<div class="bottom-bar">
    <button class="btn-main" onclick="saveBook()">保存</button>
    <span id="bookStatusBtn"></span>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/date.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">
    var bookId = getSearchString("bookId");
    document.getElementById("menuIndex").href = "/author/book_index.html?bookId=" + bookId;
    var bookStatus = 1;
    var indexCount = 0;

    // 初始化：加载作品信息 + 話
    $.ajax({
        type: "get",
        url: "/book/queryBookDetail/" + bookId,
        dataType: "json",
        success: function (res) {
            if (res.code == 200 && res.data) {
                var b = res.data;
                bookStatus = b.status;
                $("#coverImg").attr("src", b.picUrl);
                $("#workDirection").val(b.workDirection);
                $("#bookStatus").val(b.bookStatus);
                if (b.aiAssisted != null) $("#aiAssisted").val(b.aiAssisted);
                $("#bookName").val(b.bookName);
                $("#bookDesc").val(b.bookDesc);
                var catIds = (b.catId || "").split(",");
                $(".catCb").each(function(){
                    $(this).prop("checked", $.inArray($(this).val(), catIds) >= 0);
                });
                renderBookStatusBtn();
            }
        }
    });

    // カバー画像アップロード
    $("#coverFile").change(function () {
        if (this.value != "") {
            if (checkPicUpload(this)) {
                $.ajaxFileUpload({
                    url: "/file/picUpload",
                    secureuri: false,
                    fileElementId: "coverFile",
                    dataType: "json",
                    type: "post",
                    success: function (data) {
                        if (data.code == 200) {
                            var picUrl = data.data;
                            $.ajax({
                                type: "POST",
                                url: "/author/updateBookPic",
                                data: { 'bookId': bookId, 'bookPic': data.data },
                                dataType: "json",
                                success: function (d2) {
                                    if (d2.code == 200) {
                                        $("#coverImg").attr("src", picUrl);
                                        layer.msg("カバーを更新しました");
                                    } else {
                                        layer.alert(d2.msg);
                                    }
                                },
                                error: function () { layer.alert('ネットワークエラー'); }
                            });
                        } else {
                            layer.alert(data.msg);
                        }
                    },
                    error: function () { layer.alert('アップロード失敗'); }
                });
            }
        }
    });

    function renderBookStatusBtn() {
        if (bookStatus == 1) {
            $("#bookStatusBtn").html("<button class='btn-ghost' onclick=\"toggleBookStatus(0)\">非公開にする</button>");
        } else {
            $("#bookStatusBtn").html("<button class='btn-ghost' onclick=\"toggleBookStatus(1)\">公開する</button>");
        }
    }

    function saveBook() {
        $.ajax({
            type: "post",
            url: "/author/updateBook",
            data: {
                'id': bookId,
                'bookName': $("#bookName").val(),
                'workDirection': $("#workDirection").val(),
                'aiAssisted': $("#aiAssisted").val(),
                'bookStatus': $("#bookStatus").val(),
                'catId': getCheckedCats().join(","),
                'catName': getCheckedCatNames().join(","),
                'bookDesc': $("#bookDesc").val()
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    layer.msg('保存しました');
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        });
    }

    function toggleBookStatus(status) {
        layer.confirm(status == 1 ? 'この作品を公開しますか？' : 'この作品を非公開にしますか？', function () {
            $.ajax({
                type: "post",
                url: "/author/updateBookStatus",
                data: {'bookId': bookId, 'status': status},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {
                        layer.msg('操作完了');
                        bookStatus = status;
                        renderBookStatusBtn();
                    } else {
                        layer.alert(data.msg);
                    }
                },
                error: function () {
                    layer.alert('ネットワークエラー');
                }
            });
        });
    }

    var CAT_MAX = 3;
    function catCheck(el) {
        if ($(".catCb:checked").length > CAT_MAX) {
            el.checked = false;
            $("#LabErr").html("ジャンルは最大" + CAT_MAX + "つまでです");
        } else {
            $("#LabErr").html("");
        }
    }
    function getCheckedCats() {
        var arr = [];
        $(".catCb:checked").each(function(){ arr.push($(this).val()); });
        return arr;
    }
    function getCheckedCatNames() {
        var arr = [];
        $(".catCb:checked").each(function(){ arr.push($(this).data("name")); });
        return arr;
    }
</script>
