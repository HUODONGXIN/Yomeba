<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>作品編集-Yomeba</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <style type="text/css">
        .redBtn {
            padding: 5px;
            border-radius: 20px;
            border: 1px solid #3eaf7c;
            background: #3eaf7c;
            color: #fff;
        }

        a.redBtn:hover {
            color: #fff;
        }
        .form-item { margin-bottom: 12px; }
        .form-item b { display:block; margin-bottom:4px; }
    </style>
</head>
<body class="">

<div th:replace="common/top :: top('')">
    <div class="header">
        <div class="mainNav" id="mainNav">
            <div class="box_center cf"
                 style="text-align: center;height: 44px;line-height: 48px;color: #fff;font-size: 16px;">
                Yomeba著者管理
            </div>
        </div>
    </div>
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">
            <ul class="log_list">
                <li><a class="link_4 on" href="/author/index.html">作品管理</a></li>
                <li><a class="link_2 " href="/author/author_income_detail.html">収入</a></li>
            </ul>
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl">作品編集</h2>
                    <div class="fr">
                        <a href="/author/index.html" class="btn_red">作品管理に戻る</a>
                    </div>
                </div>

                <!-- 作品信息编辑 -->
                <div style="margin-bottom:24px;">
                    <div class="form-item"><b>作品の方向性：</b>
                        <select class="s_input" id="workDirection">
                            <option value="0">男性向け</option>
                            <option value="1">女性向け</option>
                        </select>
                    </div>
                    <div class="form-item"><b>ジャンル（最大3つまで）：</b>
                        <label style="margin-right:12px;"><input type="checkbox" class="catCb" value="1" data-name="ファンタジー" onclick="catCheck(this)">ファンタジー</label>
                        <label style="margin-right:12px;"><input type="checkbox" class="catCb" value="2" data-name="武侠仙侠" onclick="catCheck(this)">武侠仙侠</label>
                        <label style="margin-right:12px;"><input type="checkbox" class="catCb" value="3" data-name="都市恋愛" onclick="catCheck(this)">都市恋愛</label>
                        <label style="margin-right:12px;"><input type="checkbox" class="catCb" value="4" data-name="歴史・軍事" onclick="catCheck(this)">歴史・軍事</label>
                        <label style="margin-right:12px;"><input type="checkbox" class="catCb" value="5" data-name="SF・オカルト" onclick="catCheck(this)">SF・オカルト</label>
                        <label style="margin-right:12px;"><input type="checkbox" class="catCb" value="6" data-name="ゲーム・スポーツ" onclick="catCheck(this)">ゲーム・スポーツ</label>
                        <label><input type="checkbox" class="catCb" value="7" data-name="女性向けチャンネル" onclick="catCheck(this)">女性向けチャンネル</label>
                    </div>
                    <div class="form-item"><b>小説名：</b>
                        <input type="text" id="bookName" class="s_input"/>
                    </div>
                    <div class="form-item"><b>小説紹介：</b>
                        <textarea id="bookDesc" rows="5" cols="53" class="textarea"></textarea>
                    </div>
                    <div class="form-item">
                        <input type="button" value="保存" class="btn_red" onclick="saveBook()"/>
                        <span id="bookStatusBtn" style="margin-left:12px;"></span>
                    </div>
                </div>

                <!-- 章节管理 -->
                <div class="title cf">
                    <h2 class="fl">章リスト</h2>
                    <div class="fr">
                        <a href="javascript:batchDelete()" class="btn_red" style="margin-right:8px;">一括削除</a>
                        <a href="javascript:batchOffline()" class="btn_red" style="margin-right:8px;">一括非公開</a>
                        <a href="javascript:addContent()" class="btn_red">新しい章を作成</a>
                    </div>
                </div>

                <div id="noContentDiv">
                    <div class="tc" style="margin-top:60px"><a href="javascript:addContent()" class="btn_red">新しい章を作成</a></div>
                </div>
                <div id="hasContentDiv" style="display:none;">
                    <div id="divData" class="updateTable">
                        <table cellpadding="0" cellspacing="0">
                            <thead>
                            <tr>
                                <th class="name">章名</th>
                                <th class="goread">更新時間</th>
                                <th class="goread">有料かどうか</th>
                                <th class="goread"><input type="checkbox" id="checkAll" onclick="toggleAll(this)"> 操作</th>
                            </tr>
                            </thead>
                            <tbody id="bookList"></tbody>
                        </table>
                        <div class="pageBox cf" id="shellPage"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/date.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">
    var bookId = getSearchString("bookId");
    var bookStatus = 1;
    var indexCount = 0;

    // 初始化：加载作品信息 + 章节
    $.ajax({
        type: "get",
        url: "/book/queryBookDetail/" + bookId,
        dataType: "json",
        success: function (res) {
            if (res.code == 200 && res.data) {
                var b = res.data;
                bookStatus = b.status;
                $("#workDirection").val(b.workDirection);
                $("#bookName").val(b.bookName);
                $("#bookDesc").val(b.bookDesc);
                var catIds = (b.catId || "").split(",");
                $(".catCb").each(function(){
                    $(this).prop("checked", $.inArray($(this).val(), catIds) >= 0);
                });
                renderBookStatusBtn();
            }
        }
    });
    search(1, 5);

    function renderBookStatusBtn() {
        if (bookStatus == 1) {
            $("#bookStatusBtn").html("<a href='javascript:toggleBookStatus(0)'>非公開</a>");
        } else {
            $("#bookStatusBtn").html("<a href='javascript:toggleBookStatus(1)'>公開</a>");
        }
    }

    function saveBook() {
        $.ajax({
            type: "post",
            url: "/author/updateBook",
            data: {
                'id': bookId,
                'bookName': $("#bookName").val(),
                'workDirection': $("#workDirection").val(),
                'catId': getCheckedCats().join(","),
                'catName': getCheckedCatNames().join(","),
                'bookDesc': $("#bookDesc").val()
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    layer.msg('保存しました');
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        });
    }

    function toggleBookStatus(status) {
        layer.confirm(status == 1 ? 'この作品を公開しますか？' : 'この作品を非公開にしますか？', function () {
            $.ajax({
                type: "post",
                url: "/author/updateBookStatus",
                data: {'bookId': bookId, 'status': status},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {
                        layer.msg('操作完了');
                        bookStatus = status;
                        renderBookStatusBtn();
                    } else {
                        layer.alert(data.msg);
                    }
                },
                error: function () {
                    layer.alert('ネットワークエラー');
                }
            });
        });
    }

    var CAT_MAX = 3;
    function catCheck(el) {
        if ($(".catCb:checked").length > CAT_MAX) {
            el.checked = false;
            layer.msg("ジャンルは最大" + CAT_MAX + "つまでです");
        }
    }
    function getCheckedCats() {
        var arr = [];
        $(".catCb:checked").each(function(){ arr.push($(this).val()); });
        return arr;
    }
    function getCheckedCatNames() {
        var arr = [];
        $(".catCb:checked").each(function(){ arr.push($(this).data("name")); });
        return arr;
    }
    function toggleAll(el) {
        $(".idxCb").prop("checked", el.checked);
    }
    function getCheckedIndexIds() {
        var arr = [];
        $(".idxCb:checked").each(function(){ arr.push($(this).val()); });
        return arr;
    }
    function batchDelete() {
        var ids = getCheckedIndexIds();
        if (ids.length == 0) { layer.msg("章を選択してください"); return; }
        layer.confirm(ids.length + "件の章を削除しますか？", function () {
            var done = 0;
            ids.forEach(function (id) {
                $.ajax({ type: "delete", url: "/author/deleteIndex/" + id, dataType: "json",
                    complete: function () { done++; if (done == ids.length) { layer.msg('削除しました'); search(1, 5); } } });
            });
        });
    }
    function batchOffline() {
        var ids = getCheckedIndexIds();
        if (ids.length == 0) { layer.msg("章を選択してください"); return; }
        layer.confirm(ids.length + "件の章を非公開にしますか？", function () {
            var done = 0;
            ids.forEach(function (id) {
                $.ajax({ type: "post", url: "/author/updateIndexStatus",
                    data: {'indexId': id, 'status': 0}, dataType: "json",
                    complete: function () { done++; if (done == ids.length) { layer.msg('操作完了'); search(1, 5); } } });
            });
        });
    }

    function search(curr, limit) {
        $.ajax({
            type: "get",
            url: "/book/queryIndexList",
            data: {'bookId': bookId, 'curr': curr, 'limit': limit, 'orderBy': 'index_num desc', 'showAll': true},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    indexCount = bookList.length;
                    if (bookList.length > 0) {
                        $("#hasContentDiv").css("display", "block");
                        $("#noContentDiv").css("display", "none");
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            bookListHtml += (" <tr class=\"book_list\">" +
                                "<td><input type='checkbox' class='idxCb' value='" + book.id + "'></td>" +
                                "<td id='name" + book.id + "' class=\"name\">" + book.indexName + "</td>" +
                                "<td class=\"goread\">" + new Date(Date.parse(book.updateTime)).Format("yyyy-MM-dd hh:mm") + "<br/>更新</td>" +
                                "<td class=\"goread\">" + (book.isVip == 1 ? '有料' : '無料') + "</td>" +
                                "<td class=\"goread\" id='opt" + book.id + "'>" +
                                "<a class='redBtn' href='javascript:updateIndex(\"" + book.id + "\"," + book.isVip + ")'>変更</a><br/>" +
                                "<a href='javascript:deleteIndex(\"" + book.id + "\")'>削除</a><br/>" +
                                (book.status == 1 ? "<a href='javascript:updateIndexStatus(\"" + book.id + "\",0)'>非公開</a>" : "<a href='javascript:updateIndexStatus(\"" + book.id + "\",1)'>公開</a>") +
                                "</td></tr>");
                        }
                        $("#bookList").html(bookListHtml);
                        layui.use('laypage', function () {
                            var laypage = layui.laypage;
                            laypage.render({
                                elem: 'shellPage',
                                count: data.data.total,
                                curr: data.data.pageNum,
                                limit: data.data.pageSize,
                                jump: function (obj, first) {
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    }
                                }
                            });
                        });
                    } else {
                        $("#hasContentDiv").css("display", "none");
                        $("#noContentDiv").css("display", "block");
                    }
                } else if (data.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        });
    }

    function updateIndexStatus(indexId, status) {
        layer.confirm(status == 1 ? 'この章を公開しますか？' : 'この章を非公開にしますか？', function () {
            $.ajax({
                type: "post",
                url: "/author/updateIndexStatus",
                data: {'indexId': indexId, 'status': status},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {
                        layer.msg('操作完了');
                        search(1, 5);
                    } else {
                        layer.alert(data.msg);
                    }
                },
                error: function () {
                    layer.alert('ネットワークエラー');
                }
            });
        });
    }

    function addContent() {
        location.href = "/author/content_add.html?indexCount=" + indexCount + "&bookId=" + bookId;
    }

    function updateIndex(indexId, isVip) {
        var indexName = $.trim($("#name" + indexId).text());
        location.href = "/author/content_update.html?bookId=" + bookId
            + "&indexId=" + indexId
            + "&indexName=" + encodeURI(encodeURI(indexName))
            + "&isVip=" + isVip;
    }

    function deleteIndex(indexId) {
        layer.confirm('この章を削除しますか？', function () {
            $.ajax({
                type: "delete",
                url: "/author/deleteIndex/" + indexId,
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {
                        layer.msg('削除しました');
                        search(1, 5);
                    } else {
                        layer.alert(data.msg);
                    }
                },
                error: function () {
                    layer.alert('ネットワークエラー');
                }
            });
        });
    }
</script>
