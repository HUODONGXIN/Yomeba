            /* エディタコンテナのスタイル */
            .editor-container {
                margin: 10px 0px;
                padding: 20px;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, .1);
            }

            /* テキストエリアのスタイル */
            #bookContent {
                width: 93%;
                height: 400px;
                padding: 15px;
                border: 1px solid #e6e6e6;
                border-radius: 4px;
                font-size: 14px;
                line-height: 1.6;
                resize: vertical;
            }

            /* ツールバーのスタイル */
            .ai-toolbar {
                margin-bottom: 15px;
                display: flex;
                gap: 10px; /* ボタン間隔 */
            }

            /* カスタムリンクボタンのスタイル */
            .ai-link {
                display: inline-block;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                color: #fff;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.3s ease;
                background: linear-gradient(135deg, #6a11cb, #2575fc);
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* リンクボタンのホバー効果 */
            .ai-link:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            }

            /* リンクボタンのクリック効果 */
            .ai-link:active {
                transform: translateY(0);
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* ボタンごとの色 */
            .ai-link.expand {
                background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            }

            .ai-link.condense {
                background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            }

            .ai-link.continue {
                background: linear-gradient(135deg, #f6d365, #fda085);
            }

            .ai-link.polish {
                background: linear-gradient(135deg, #ff6f61, #ffcc00);
            }
        </style>

<script language="javascript" type="text/javascript">


    var lock = false;

    function addBookContent() {

        if (lock) {
            return;
        }
        lock = true;


        var bookId = getSearchString("bookId");


        var indexName = $("#bookIndex").val();
        if (!indexName) {
            $("#LabErr").html("話名を入力してください！");
            lock = false;
            return;
        }

        var content = $("#bookContent").val();
        if (!content) {
            $("#LabErr").html("話内容を入力してください！");
            lock = false;
            return;
        }


        var isVip = $("input:checked[name=isVip]").val();


        $.ajax({
            type: "POST",
            url: "/author/addBookContent",
            data: {'bookId': bookId, 'indexName': indexName, 'content': content, 'isVip': isVip},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    window.location.href = '/author/index_list.html?bookId=' + bookId;


                } else {
                    lock = false;
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                lock = false;
                layer.alert('ネットワークエラー');
            }
        })

    }


    // タイプライター風表示関数
    function typeWriter(textarea, text, speed = 50) {
        let i = 0;
        const timer = setInterval(() => {
            if (i < text.length) {
                textarea.val(textarea.val() + text.charAt(i));
                i++;
                // 最下部へスクロール
                textarea.scrollTop(textarea[0].scrollHeight);
            } else {
                clearInterval(timer);
            }
        }, speed);
    }

    $('.ai-toolbar .ai-link').click(function (e) {
        e.preventDefault(); // デフォルトのリンク動作を阻止
        const type = $(this).data('type');
        const textarea = $('#bookContent');
        const selectedText = textarea.val().substring(textarea[0].selectionStart, textarea[0].selectionEnd);

        // テキストが選択されているか確認
        if (!selectedText) {
            layer.msg('処理するテキストを先に選択してください');
            return;
        }

        const loading = layer.load(1, {shade: 0.3});

        // パラメータ設定
        let params = {text: selectedText};
        if (type === 'stream/expand' || type === 'stream/condense') {
            layer.prompt({
                title: '比率を入力してください',
                value: 2,
                btn: ['確定', 'キャンセル'],
                btn2: function () {
                    layer.close(loading);
                },
                cancel: function () {
                    layer.close(loading);
                }
            }, function (value, index) {
                if (isNaN(Number(value)) || isNaN(parseFloat(value))) {
                    layer.msg('正しい比率を入力してください');
                    return;
                }
                if (type === 'stream/expand' && value <= 1) {
                    layer.msg('正しい比率を入力してください');
                    return;
                }
                if (type === 'stream/condense' && (value <= 0 || value >= 1)) {
                    layer.msg('正しい比率を入力してください');
                    return;
                }
                params.ratio = parseFloat(value) * 100;
                layer.close(index);
                sendRequest(type, params, loading, textarea);
            });
            return;
        } else if (type === 'stream/continue') {
            layer.prompt({
                title: '続きの文字数を入力してください（文字数）',
                value: 200,
                btn: ['確定', 'キャンセル'],
                btn2: function () {
                    layer.close(loading);
                },
                cancel: function () {
                    layer.close(loading);
                }
            }, function (value, index) {
                if (!Number.isInteger(Number(value)) || value <= 0) {
                    layer.msg('正しい長さを入力してください');
                    return;
                }
                params.length = parseInt(value);
                layer.close(index);
                sendRequest(type, params, loading, textarea);
            });
            return;
        }

        sendRequest(type, params, loading, textarea);
    });

    function sendRequest(type, params, loading, textarea) {
        const url = `/author/ai/${type}?text=${encodeURIComponent(params.text)}&ratio=${params.ratio}&length=${params.length}`;
        const eventSource = new EventSource(url);

        // メッセージイベントを監視
        eventSource.onmessage = function (event) {
            layer.close(loading);
            const data = event.data;
            console.log('Received data:', data);

            textarea.val(textarea.val() + data);
            // 最下部へスクロール
            textarea.scrollTop(textarea[0].scrollHeight);
        };

        // エラーイベントを監視
        eventSource.onerror = function (error) {
            layer.close(loading);
            console.error('EventSource failed:', error);
            eventSource.close(); // 接続を閉じる
        };

    }

</script>
