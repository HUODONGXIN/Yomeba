

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="${book.bookName}+'作品レビュー_'+${application.website.name}"></title>
    <meta name="keywords" th:content="${book.bookName}+'公式初掲載,'+${book.bookName}+'小説,'+${book.bookName}+'最新話,'+${book.bookName}+'txtダウンロード,'+${book.bookName}+'ポップアップなし,'+${book.bookName}+'完本オフライン'"/>
    <meta name="description" th:content="${book.bookName}+','+${book.bookName}+'小説読書,'+${application.website.name}+'は'+${book.bookName}+'の初掲載最新話およびtxtダウンロードを提供,'+${book.bookName}+'最新更新話は'+${application.website.name}+'へ。'"/>
    <link href="/css/main.css" rel="stylesheet" />
    <link href="/css/book.css" rel="stylesheet" />
</head>
<body>

<input type="hidden" id="bookId" th:value="${book.id}"/>

<div th:replace="common/top :: top('')">
</div>

<div class="main box_center cf mb50">
    <div class="channelBookContent cf">
        <!--left start-->
        <div class="wrap_left fl">
            <div class="wrap_bg">
                <div class="pad20">

                    <div class="bookComment">
                        <div class="book_tit">
                            <div class="fl">
                                <h3>作品レビュー</h3><span id="bookCommentTotal">(0件)</span>
                            </div>
                            <a class="fr" href="#txtComment">レビューを書く</a>
                        </div>
                        <div class="no_comment" id="noCommentPanel" style="display: none;">
                            <img src="/images/no_comment.png" alt="" />
                            <span class="block">レビューはまだありません</span>
                        </div>
                        <div class="commentBar" id="commentPanel">

                        </div>
                        <div class="pageBox cf mt15 mr10" id="commentPage">
                        </div>

                        <div class="reply_bar" id="reply_bar">
                            <div class="tit">
                                <span class="fl font16">レビューを書く</span>
                                <!--未ログイン時はレビューを書けないため、以下のリンクを表示-->
                                <span class="fr black9" style="display:none; ">先に <a class="orange" href="/user/login.html">ログイン</a><em class="ml10 mr10">|</em><a class="orange" href="/user/register.html">会員登録</a></span>
                            </div>
                            <textarea name="txtComment" rows="2" cols="20" id="txtComment" class="replay_text" placeholder="コメントをどうぞ..."></textarea>
                            <div class="reply_btn">
                                <span class="fl black9"><em class="ml5" id="emCommentNum">0/1000</em> 文字</span>
                                <span class="fr"><a class="btn_ora" href="javascript:void(0);" onclick="javascript:BookDetail.SaveComment(37,0,$('#txtComment').val());">投稿</a></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!--left end-->

        <!--right start-->
        <div class="wrap_right fr">



            <div class="wrap_inner author_info mb20">

                <div class="author_head cf">
                    <a href="javascript:void(0);" class="head"><img src="/images/author_head.png" alt="著者アイコン"
                                                                    id="authorLogoImg"/></a>
                    <div class="msg">
                        <span class="icon_qyzz">契約作家</span>
                        <h4><a th:href="'javascript:searchByK(\''+${book.authorName}+'\')'"
                               th:text="${book.authorName}"></a></h4>
                    </div>
                </div>
                <div class="author_intro cf">
                    <h4>著者からのメッセージ</h4>
                    <div class="intro_txt" id="authorNote">
                        皆さんの応援が何よりの励みです！クリック、おすすめ、レビューよろしくお願いします！
                    </div>
                </div>
                <!--著者の他の作品がない場合、下のコード全体を非表示にする-->


            </div>
            <!--著者コラム 終了-->
            <script type="text/javascript">
                var authorUId=8;
                if(authorUId==0)
                {$("#authorPanel").hide();}
                else
                {
                }
            </script>



        </div>
        <!--right end-->
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/bookdetail.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
    $('#txtComment').on('input propertychange', function () {
        var count = $(this).val().length;
        $('#emCommentNum').html(count + "/1000");
        if (count > 1000) {
            $('#txtComment').val($('#txtComment').val().substring(0, 1000));
        }
    });
    loadCommentList(1, 20);

    function loadCommentList(curr, limit) {

        $.ajax({
            type: "get",
            url: "/book/listCommentByPage",
            data: {'bookId': $("#bookId").val(),'curr':curr,'limit':limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var commentList = data.data.list;
                    if (commentList.length > 0) {
                        $("#bookCommentTotal").html("("+data.data.total+"件)");
                        var commentListHtml = "";
                        for (var i = 0; i < commentList.length; i++) {
                            var comment = commentList[i];
                            commentListHtml += ("<div class=\"comment_list cf\">" +
                                "<div class=\"user_heads fl\" vals=\"389\">" +
                                "<img src=\""+(comment.createUserPhoto ? comment.createUserPhoto : '/images/man.png')+"\" class=\"user_head\" alt=\"\">" +
                                "<span class=\"user_level1\" style=\"display: none;\">見習い</span></div>" +
                                "<ul class=\"pl_bar fr\">\t\t\t<li class=\"name\">"+(comment.createUserName)+"<span style='padding-left: 10px' class=\"other\">"+(comment.location ? comment.location + "の読者" : '')+"</span></li><li class=\"dec\">" +
                                comment.commentContent+
                                "</li><li class=\"other cf\">" +
                                "<span class=\"time fl\">"+comment.createTime+"</span>" +
                                "<span class=\"fr\"><a href=\"javascript:toggleCommentUnLike('"+comment.id+"')\"  class=\"zan\"  style=\"padding-left: 10px\">ダメ<i class=\"num\" id='unLikeCount"+comment.id+"'>("+comment.unLikesCount+")</i></a></span>" +
                                "<span class=\"fr\"><a href=\"javascript:toggleCommentLike('"+comment.id+"')\"  class=\"zan\" style=\"padding-left: 10px\">いいね<i class=\"num\" id='likeCount"+comment.id+"'>("+comment.likesCount+")</i></a></span>" +
                                "<span class=\"fr\"><a href=\"/book/reply-"+comment.id+".html\" class=\"zan\" style=\"padding-left: 10px\">返信<i class=\"num\">("+comment.replyCount+
                                ")</i></a></span>" +
                                "</li>\t\t</ul>\t</div>");
                        }
                        $("#commentPanel").html(commentListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            //laypageインスタンスを実行
                            laypage.render({
                                elem: 'commentPage' //注意：ここは ID。# は付けない # 号
                                , count: data.data.total //データ総数。サーバーから取得,
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    //objには現在のページの全パラメータが含まれる。例：
                                    console.log(obj.curr); //現在のページを取得し、サーバーに該当ページのデータを要求。
                                    console.log(obj.limit); //1ページあたりの表示件数を取得


                                    //初回は実行しない
                                    if (!first) {
                                        searchComments(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    }

    function toggleCommentLike(commentId) {
        $.ajax({
            type: "post",
            url: "/book/toggleCommentLike",
            data: {'commentId': commentId},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#likeCount"+commentId).text("("+data.data+")")
                } else if (data.code == 1001) {
                    //未ログイン
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                }  else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    }

    function toggleCommentUnLike(commentId) {
        $.ajax({
            type: "post",
            url: "/book/toggleCommentUnLike",
            data: {'commentId': commentId},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#unLikeCount"+commentId).text("("+data.data+")")
                } else if (data.code == 1001) {
                    //未ログイン
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                }  else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    }
</script>
</body>
</html>
