 
 
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>メッセージボックス</title>

<link rel="stylesheet" href="../../../layui.css?v=1">
<style>
.layim-msgbox{margin: 15px;}
.layim-msgbox li{position: relative; margin-bottom: 10px; padding: 0 130px 10px 60px; padding-bottom: 10px; line-height: 22px; border-bottom: 1px dotted #e2e2e2;}
.layim-msgbox .layim-msgbox-tips{margin: 0; padding: 10px 0; border: none; text-align: center; color: #999;}
.layim-msgbox .layim-msgbox-system{padding: 0 10px 10px 10px;}
.layim-msgbox li p span{padding-left: 5px; color: #999;}
.layim-msgbox li p em{font-style: normal; color: #FF5722;}

.layim-msgbox-avatar{position: absolute; left: 0; top: 0; width: 50px; height: 50px;}
.layim-msgbox-user{padding-top: 5px;}
.layim-msgbox-content{margin-top: 3px;}
.layim-msgbox .layui-btn-small{padding: 0 15px; margin-left: 5px;}
.layim-msgbox-btn{position: absolute; right: 0; top: 12px; color: #999;}
</style>
</head>
<body>

<ul class="layim-msgbox" id="LAY_view"></ul>

<div style="margin: 0 15px;">
  <blockquote class="layui-elem-quote">注意：これらはすべてシミュレーションデータです。実際に使用する際は、シミュレーションインターフェースを実際のプロジェクトのインターフェースに変更してください。
  <br>このテンプレートファイルの場所（layui.js基準）：/css/modules/layim/html/msgbox.html</blockquote>
</div>

<textarea title="メッセージテンプレート" id="LAY_tpl" style="display:none;">
{{# layui.each(d.data, function(index, item){
  if(item.from){ }}
    <li data-uid="{{ item.from }}" data-fromGroup="{{ item.from_group }}">
      <a href="/u/{{ item.from }}/" >
        <img src="{{ item.user.avatar }}" class="layui-circle layim-msgbox-avatar">
      </a>
      <p class="layim-msgbox-user">
        <a href="/u/{{ item.from }}/" >{{ item.user.username||'' }}</a>
        <span>{{ item.time }}</span>
      </p>
      <p class="layim-msgbox-content">
        {{ item.content }} 
        <span>{{ item.remark ? '追記: '+item.remark : '' }}</span>
      </p>
      <p class="layim-msgbox-btn">
        <button class="layui-btn layui-btn-small" data-type="agree">承認</button>
        <button class="layui-btn layui-btn-small layui-btn-primary" data-type="refuse">拒否</button>
      </p>
    </li>
  {{# } else { }}
    <li class="layim-msgbox-system">
      <p><em>システム：</em>{{ item.content }}<span>{{ item.time }}</span></p>
    </li>
  {{# }
}); }}
</textarea>

<!-- 
上記テンプレートはlaytpl構文を使用しています。詳しくはドキュメントをご覧ください：http://www.layui.com/doc/modules/laytpl.html 
-->


<script src="../../../../layui.js?v=1"></script>
<script>
layui.use(['layim', 'flow'], function(){
  var layim = layui.layim
  ,layer = layui.layer
  ,laytpl = layui.laytpl
  ,$ = layui.jquery
  ,flow = layui.flow;

  var cache = {}; //リクエストしたデータを一時的に記録

  //メッセージをリクエスト
  var renderMsg = function(page, callback){
    
    //実際にデプロイする際は、以下のgetmsg.jsonを実際のAPIアドレスに変更してください
    
    $.get('getmsg.json', {
      page: page || 1
    }, function(res){
      if(res.code != 0){
        return layer.msg(res.msg);
      }

      //送信元ユーザー情報を記録
      layui.each(res.data, function(index, item){
        cache[item.from] = item.user;
      });

      callback && callback(res.data, res.pages);
    });
  };

  //メッセージ情報フロー
  flow.load({
    elem: '#LAY_view' //フロー読み込みコンテナ
    ,isAuto: false
    ,end: '<li class="layim-msgbox-tips">新しいメッセージはありません</li>'
    ,done: function(page, next){ //次のページを読み込み
      renderMsg(page, function(data, pages){
        var html = laytpl(LAY_tpl.value).render({
          data: data
          ,page: page
        });
        next(html, page < pages);
      });
    }
  });

  //ページを開いたらメッセージを既読にする
  /*
  $.post('/message/read', {
    type: 1
  });
  */

  //操作
  var active = {
    //承認
    agree: function(othis){
      var li = othis.parents('li')
      ,uid = li.data('uid')
      ,from_group = li.data('fromGroup')
      ,user = cache[uid];

      //グループを選択
      parent.layui.layim.setFriendGroup({
        type: 'friend'
        ,username: user.username
        ,avatar: user.avatar
        ,group: parent.layui.layim.cache().friend //友達グループデータを取得
        ,submit: function(group, index){
          
          //友達をメインパネルに追加
          parent.layui.layim.addList({
            type: 'friend'
            ,avatar: user.avatar //友達のアバター
            ,username: user.username //友達のニックネーム
            ,groupid: group //所属グループID
            ,id: uid //友達ID
            ,sign: user.sign //友達の署名
          });
          parent.layer.close(index);
          othis.parent().html('承認済み');
        
        
          //実際にデプロイする際は、以下のコメントを有効にしてAPIアドレスを変更
          /*
          $.post('/im/agreeFriend', {
            uid: uid //相手のユーザーID
            ,from_group: from_group //相手が設定した友達グループ
            ,group: group //自分が設定した友達グループ
          }, function(res){
            if(res.code != 0){
              return layer.msg(res.msg);
            }

            //友達をメインパネルに追加
            parent.layui.layim.addList({
              type: 'friend'
              ,avatar: user.avatar //友達のアバター
              ,username: user.username //友達のニックネーム
              ,groupid: group //所属グループID
              ,id: uid //友達ID
              ,sign: user.sign //友達の署名
            });
            parent.layer.close(index);
            othis.parent().html('承認済み');
          });
          */
          
        }
      });
    }

    //拒否
    ,refuse: function(othis){
      var li = othis.parents('li')
      ,uid = li.data('uid');

      layer.confirm('本当に拒否しますか？', function(index){
        $.post('/im/refuseFriend', {
          uid: uid //相手のユーザーID
        }, function(res){
          if(res.code != 0){
            return layer.msg(res.msg);
          }
          layer.close(index);
          othis.parent().html('<em>拒否済み</em>');
        });
      });
    }
  };

  $('body').on('click', '.layui-btn', function(){
    var othis = $(this), type = othis.data('type');
    active[type] ? active[type].call(this, othis) : '';
  });
});
</script>
</body>
</html>
