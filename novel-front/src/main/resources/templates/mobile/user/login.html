<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>ログイン</title>

    <div th:include="mobile/common/css :: css"></div>


</head>
<body id="read">

<div style="height: 50px;line-height: 50px;text-align: center" class="layui-header header header-doc  layui-bg-cyan">

    <div style="width:10%;float: left;margin-left: 10px">
        <a href="javascript:history.go(-1)">
            <i style="font-size: 20px;color: #fff;" class="layui-icon">&#xe65c;</i></a>
    </div>
    <b class="layui-icon">ログイン</b>
    <div style="width:10%;float: right;margin-right: 10px"><a href="/">
        <i style="font-size: 20px;color: #fff;" class="layui-icon">&#xe68e;</i>
    </a>
    </div>
</div>
<form lay-filter="loginForm" id="form1" style="height: 500px;padding-top:30px;padding-right: 20px" class="layui-form"
      action="">
    <input type="hidden" id="bookIdHidden" name="bookId" th:value="${bookId}"/>
    <div class="layui-form-item">
        <label class="layui-form-label">携帯番号 / ログインアカウント</label>
        <div class="layui-input-inline">
            <input name="txtUName" type="text" id="txtUName" placeholder="携帯番号またはログインアカウントを入力してください"
                   autocomplete="off" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item">
        <label class="layui-form-label">パスワード</label>
        <div class="layui-input-inline">
            <input name="txtPassword" type="password" id="txtPassword" placeholder="パスワードを入力してください"
                   autocomplete="off" class="layui-input">
        </div>

    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <input id="autoLogin" type="checkbox" lay-skin="primary" title="次回から自動ログイン">
        </div>
    </div>
    <div class="layui-form-item">
        <div class="layui-input-block">
            <input type="button" value="ログイン" id="btnLogin" class="layui-btn"/>
            <a class="layui-btn layui-btn-primary" href="/user/register.html">会員登録</a>
        </div>
    </div>
</form>


<div th:replace="mobile/common/footer :: footer">
</div>
</body>
<div th:replace="mobile/common/js :: js">
</div>
<script type="text/javascript">
    if (localStorage.getItem("autoLogin") == 1) {
        $("#autoLogin").prop("checked", 'true');
        layui.form.render('checkbox', 'loginForm');
    } else {
        $("#autoLogin").removeAttr("checked");
    }
    $("#btnLogin").click(function () {
        var username = $("#txtUName").val();
        if (username.isBlank()) {
            layer.alert("携帯番号またはログインアカウントを入力してください！");
            return;
        }
        var password = $("#txtPassword").val();
        if (password.isBlank()) {
            layer.alert("パスワードを入力してください！");
            return;
        }
        $.ajax({
            type: "POST",
            url: "/user/login",
            data: {"username": username, "password": password},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    if ($("#autoLogin").is(':checked')) {
                        $.cookie('Authorization', data.data.token, {expires: 7, path: '/'});
                        localStorage.setItem("autoLogin", "1");
                    } else {
                        $.cookie('Authorization', data.data.token, {path: '/'});
                        localStorage.setItem("autoLogin", "0");
                    }
                    var orginUrl = getSearchString("originUrl");
                    window.location.href = orginUrl == undefined || orginUrl.isBlank() ? "/" : orginUrl;
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('ネットワークエラー');
            }
        })

    })
</script>


</html>
