<div th:fragment="top(navType)" class="header">
    <div class="topBar" style="display: none">
        <div class="box_center cf">
            <div class="top_l">
                <a href="/" class="on" th:text="${application.website.name}"></a><i class="line">|</i><a
                    href="/?m=2">モバイル（女性向け）</a><i class="line">|</i><a
                    href="/?m=1">モバイル（男性向け）</a><i class="line">|</i><a

            </div>
            <div class="top_r">

                    <a href="javascript:void(0);" class="nearread" id="headerUserHistoryBtn">最近読んだ本<i

                    </div>
                </div>
                <span>
                </span>
            </div>
        </div>

    <div class="topMain">

            <a href="/?m=2" class="logo fl"><img th:src="${application.website.logo}"

            <div class="searchBar fl">

                    <input type="text" placeholder="書名、著者、キーワード" class="s_int" name="searchKey" id="searchKey"/>

            </div>
        </div>
    </div>
    <div class="mainNav" id="mainNav" th:style="${navType} == 10?'display:none':''">
        <div class="box_center cf">
            <ul class="nav" id="navModule">

                <li th:class="${navType}==0?'on':''"><a href="/">ホーム</a></li>
                <li th:class="${navType}==1?'on':''"><a href="/book/bookclass.html">すべての作品</a></li>

                <li class=""><a href="/pay/index.html">チャージ</a></li>
