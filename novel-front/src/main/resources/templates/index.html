<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="${application.website.name}+'_オリジナル小説サイト'"></title>
    <meta name="keywords" th:content="${application.website.keyword}"/>
    <meta name="description"
          th:content="${application.website.description}"/>
    <link href="/favicon.ico" type="image/x-icon" rel="shortcut icon"/>
    <link href="/favicon.ico" type="image/x-icon" rel="Bookmark"/>
    <link rel="stylesheet" href="/css/main.css?v=1"/>
    <link rel="stylesheet" href="/css/index.css?v=1"/>
</head>
<body>

<div th:replace="common/top :: top('0')">
</div>

<!-- ============ HERO バナー ============ -->
<section class="hero">
    <div class="hero-inner">
        <div class="hero-badge">Yomeba 10周年</div>
        <h1 class="hero-title">お祝いイラスト<br/>一挙公開！</h1>
        <p class="hero-desc">Yomebaを支えていただいた作家の皆様の<br/>描き下ろしイラストをご紹介！</p>
    </div>
</section>

<!-- ============ キャンペーン ============ -->
<section class="campaign">
    <div class="campaign-body">
        <div class="campaign-txt">
            <strong>新規登録キャンペーン実施中！</strong>
            <span>今すぐ登録で全作品が読み放題。人気の異世界、悪役令嬢、転生ものを無料で楽しめます。</span>
        </div>
        <a class="btn-free" href="/user/register.html">無料で始める →</a>
    </div>
</section>

<div class="home-main">

    <!-- ============ 旬の作品 ============ -->
    <section class="sec">
        <div class="sec-head">
            <h2 class="sec-title">いま読むべき旬の作品！</h2>
            <a class="sec-more" href="/book/book_ranking.html">もっと見る</a>
        </div>
        <ul class="rail" id="hotRail"></ul>
    </section>

    <!-- ============ 新作小説 ============ -->
    <section class="sec">
        <div class="sec-head">
            <h2 class="sec-title">新作小説</h2>
            <a class="sec-more" href="/book/book_ranking.html?type=1">もっと見る</a>
        </div>
        <ul class="rail" id="newRail"></ul>
    </section>

    <!-- ============ おすすめ（分類タブ + 双列リスト） ============ -->
    <section class="sec">
        <div class="sec-head">
            <h2 class="sec-title">おすすめ！</h2>
            <a class="sec-more" href="/book/bookclass.html">もっと見る</a>
        </div>
        <ul class="genre-tabs" id="genreTabs">
            <li class="on"><a href="/book/bookclass.html">総合</a></li>
        </ul>
        <div class="book-list" id="rankList"></div>
    </section>

    <!-- ============ ジャンル一覧（男性向け/女性向け） ============ -->
    <section class="sec">
        <div class="genre-board">
            <div class="genre-col">
                <h3 class="genre-title male">男性向け</h3>
                <div class="genre-tags" id="maleTags"></div>
            </div>
            <div class="genre-col">
                <h3 class="genre-title female">女性向け</h3>
                <div class="genre-tags" id="femaleTags"></div>
            </div>
        </div>
    </section>

    <!-- ============ お知らせ ============ -->
    <section class="sec news-sec">
        <div class="sec-head">
            <h2 class="sec-title">お知らせ</h2>
        </div>
        <ul class="news-list" id="indexNews">
            <li th:each="news : ${newsList}">
                <span class="news-cat" th:text="'['+${news.catName}+']'"></span>
                <a class="news-title" th:href="'/about/newsInfo-'+${news.id}+'.html'" th:utext="${news.title}"></a>
                <span class="news-time" th:if="${news.createTime != null}" th:text="${#dates.format(news.createTime,'yyyy-MM-dd')}"></span>
            </li>
        </ul>
    </section>

</div>

<div class="friend_link">
    <div class="box_center cf" id="friendLink">
        <span>リンク：</span>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>


</body>
<div th:replace="common/js :: js"></div>
<script src="/javascript/lazyload.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">

    function escHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
        });
    }

    function fmtCount(n) {
        n = Number(n || 0);
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
        return String(n);
    }

    function coverBg(name) {
        var hue = ((name || '').length * 47 + 120) % 360;
        return 'linear-gradient(135deg, hsl(' + hue + ',65%,60%), hsl(' + ((hue + 45) % 360) + ',70%,42%))';
    }

    function coverHtml(book) {
        var title = escHtml(book.bookName);
        var fb = '<div class="cover cover-fallback" style="background:' + coverBg(book.bookName) + '">' + title + '</div>';
        if (book.picUrl && book.picUrl.indexOf('default.gif') < 0) {
            return '<img class="cover" src="' + book.picUrl + '" alt="' + title + '"/>';
        }
        return fb;
    }

    function railItem(book) {
        return '<li class="rail-item">' +
            '<a class="rail-cover" href="/book/' + book.id + '.html">' + coverHtml(book) + '</a>' +
            '<p class="rail-title"><a href="/book/' + book.id + '.html">' + escHtml(book.bookName) + '</a></p>' +
            '</li>';
    }

    function listItem(book) {
        var score = (book.score != null) ? Number(book.score).toFixed(1) : '0.0';
        return '<div class="list-item">' +
            '<a class="li-cover" href="/book/' + book.id + '.html">' + coverHtml(book) + '</a>' +
            '<div class="li-info">' +
            '<h4 class="li-title"><a href="/book/' + book.id + '.html">' + escHtml(book.bookName) + '</a></h4>' +
            '<div class="li-meta">' +
            '<span class="li-score">★ ' + score + '</span>' +
            '<span class="li-count">' + fmtCount(book.visitCount) + '</span>' +
            '<span class="li-author">著者：' + escHtml(book.authorName) + '</span>' +
            '<span class="li-cat">' + escHtml(book.catName) + '</span>' +
            '</div>' +
            '<p class="li-desc">' + escHtml(book.bookDesc) + '</p>' +
            '</div></div>';
    }

    function loadRail(id, data, max) {
        var html = '';
        for (var i = 0; i < data.length && i < (max || data.length); i++) {
            html += railItem(data[i]);
        }
        $(id).html(html);
    }

    function loadList(id, data, max) {
        var html = '';
        for (var i = 0; i < data.length && i < (max || data.length); i++) {
            html += listItem(data[i]);
        }
        $(id).html(html);
    }

    $(function () {
        // 旬の作品（クリックランキング）
        $.ajax({
            type: "get", url: "/book/listClickRank", data: {}, dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    loadRail("#hotRail", data.data, 6);
                }
            }
        });
        // 新作小説
        $.ajax({
            type: "get", url: "/book/listNewRank", data: {}, dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    loadRail("#newRail", data.data, 6);
                }
            }
        });
        // おすすめ双列リスト（更新ランキング）
        $.ajax({
            type: "get", url: "/book/listUpdateRank", data: {}, dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    loadList("#rankList", data.data, 10);
                }
            }
        });
        // ジャンル一覧（男性向け/女性向け）
        $.ajax({
            type: "get", url: "/book/listBookCategory", data: {}, dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var male = '', female = '', maleTabs = '', femaleTabs = '';
                    var maleCount = 0, femaleCount = 0;
                    for (var i = 0; i < data.data.length; i++) {
                        var c = data.data[i];
                        var tag = '<a href="/book/bookclass.html?c=' + c.id + '">' + escHtml(c.name) + '</a>';
                        if (c.workDirection == 1) {
                            female += tag;
                            femaleTabs += '<li><a href="/book/bookclass.html?c=' + c.id + '">' + escHtml(c.name) + '</a></li>';
                            femaleCount++;
                        } else {
                            male += tag;
                            if (maleCount < 6) {
                                maleTabs += '<li><a href="/book/bookclass.html?c=' + c.id + '">' + escHtml(c.name) + '</a></li>';
                            }
                            maleCount++;
                        }
                    }
                    $("#maleTags").html(male);
                    $("#femaleTags").html(female);
                    if (maleTabs) {
                        $("#genreTabs").append(maleTabs);
                    }
                    if (femaleTabs) {
                        $("#genreTabs").append(femaleTabs);
                    }
                }
            }
        });
        // 友情リンク
        $.ajax({
            type: "get", url: "/friendLink/listIndexLink", data: {}, dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var html = "";
                    for (var i = 0; i < data.data.length; i++) {
                        var f = data.data[i];
                        html += ("<a target='_blank' href=\"" + f.linkUrl + "\">" + f.linkName + "</a>");
                    }
                    $("#friendLink").append(html);
                }
            }
        });
    });
</script>
</html>
