            .form-item { margin-bottom:16px; }

            .s_input { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid #e0e0e0; border-radius:6px; }
            textarea.textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid #e0e0e0; border-radius:6px; }
            .catCb-label { display:inline-block; margin:0 14px 6px 0; font-size:13px; }

            .bottom-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; padding:12px 0; text-align:center; box-shadow:0 -2px 8px rgba(0,0,0,.05); z-index:100; }
            .bottom-bar .btn-main { background:#3eaf7c; color:#fff; border:none; padding:10px 48px; border-radius:24px; font-size:15px; cursor:pointer; }

<script language="javascript" type="text/javascript">

    function picChange() {
        var file = $("#file0").val(); //ファイル名
        if (file != "") {

            if(checkPicUpload($("#file0")[0])) {
                $.ajaxFileUpload({
                    url: "/file/picUpload", //ファイルアップロード用サーバーリクエストURL
                    secureuri: false, //セキュリティプロトコルが必要かどうか。通常はfalse
                    fileElementId: "file0", //ファイルアップロードフィールドのID
                    dataType: "json", //戻り値の型。通常はjson
                    type: "post",
                    success: function (data) { //サーバー成功応答処理関数
                        if (data.code == 200) {
                            $("#picImage").attr("src", data.data);
                            $("#picUrl").val(data.data);
                        } else {
                            layer.alert(data.msg);
                        }

                    }

                });
            }
        } else {
            alert("アップロードするファイルを選択してください！");
        }



    }

    var lock = false;
    var CAT_MAX = 3;
    function catCheck(el) {
        if ($(".catCb:checked").length > CAT_MAX) {
            el.checked = false;
            $("#LabErr").html("ジャンルは最大" + CAT_MAX + "つまでです");
        }
    }
    function getCheckedCats() {
        var arr = [];
        $(".catCb:checked").each(function(){ arr.push($(this).val()); });
        return arr;
    }
    function getCheckedCatNames() {
        var arr = [];
        $(".catCb:checked").each(function(){ arr.push($(this).data("name")); });
        return arr;
    }

    function addBook() {
        if(lock){
            return;
        }
        lock = true;



        var bookName = $("#bookName").val();
        if(!bookName){
            $("#LabErr").html("小説名を入力してください！");
            lock = false;
            return;
        }
        if(bookName.length > 20){
            $("#LabErr").html("小説名が長すぎます！");
            lock = false;
            return;
        }
        if(getCheckedCats().length == 0){
            $("#LabErr").html("ジャンルを選択してください！");
            lock = false;
            return;
        }

        var picUrl = $("#picUrl").val();
        if(!picUrl){
            $("#LabErr").html("カバー画像を選択してください！");
            lock = false;
            return;
        }

        var bookDesc = $("#bookDesc").val();
        if(!bookDesc){
            $("#LabErr").html("紹介文を入力してください！");
            lock = false;
            return;
        }


        $.ajax({
            type: "POST",
            url: "/author/addBook",
            data: {'workDirection': $("#workDirection").val(),
            'catId':getCheckedCats().join(","),'catName':getCheckedCatNames().join(","),
            'bookName':bookName,'picUrl':picUrl,'bookDesc':bookDesc},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    window.location.href = '/author/index.html';


                } else {
                    lock = false;
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                lock = false;
                layer.alert('ネットワークエラー');
            }
        })

    }

</script>
