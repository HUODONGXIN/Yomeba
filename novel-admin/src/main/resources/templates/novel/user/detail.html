<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
            <div class="ibox-content">
            <form class="form-horizontal m-t" id="signupForm">
                <input id="id" name="id" th:value="${user.id}"
                       type="hidden">
                                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">ログイン名：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.username}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">ログインパスワード：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.password}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">ニックネーム：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.nickName}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">アバター：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.userPhoto}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">性別（0：男性、1：女性）：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.userSex}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">残高：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.accountBalance}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">ユーザー状態（0：正常）：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.status}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">作成日時：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.createTime}==null?null:${#dates.format(user.createTime,'yyyy-MM-dd HH:mm:ss')}">
                            </div>
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label">更新日時：</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${user.updateTime}==null?null:${#dates.format(user.updateTime,'yyyy-MM-dd HH:mm:ss')}">
                            </div>
                        

                    </div>
                                                    </form>
            </div>
        </div>
    </div>
</div>
</div>
<div th:include="include::footer"></div>
</body>
</html>
