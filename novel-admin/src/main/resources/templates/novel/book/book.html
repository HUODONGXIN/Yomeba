<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns pull-left">
                        <button shiro:hasPermission="novel:book:add" type="button"
                                class="btn  btn-primary" onclick="add()">
                            <i class="fa fa-plus" aria-hidden="true"></i>添加
                        </button>
                        <div id="batchDelBtn" style="display:none;">
                            <button shiro:hasPermission="novel:book:batchRemove" type="button"
                                    class="btn  btn-danger"
                                    onclick="batchRemove()">
                                <i class="fa fa-trash" aria-hidden="true"></i>批量删除
                            </button>
                        </div>
                    </div>
                    <div class="columns pull-right">
                        <button class="btn btn-success" onclick="reLoad()">查询</button>
                    </div>

                    <form id="searchForm">
                        <div class="columns pull-right col-md-1">
                            <select id="workDirection" name="workDirection" class="form-control">
                                <option value="">作品方向</option>
                                <option value="0">男频</option>
                                <option value="1">女频</option>
                            </select>
                        </div>
                        <div class="columns pull-right col-md-2">
                            <select id="catId" name="catId" class="form-control">
                                <option value="">作品分类</option>
                            </select>
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="minCreateTime" name="minCreateTime" type="date" class="form-control"
                                   placeholder="入库开始">
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="maxCreateTime" name="maxCreateTime" type="date" class="form-control"
                                   placeholder="入库结束">
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="bookName" name="bookName" type="text" class="form-control"
                                   placeholder="小说名">
                        </div>
                        <div class="columns pull-right col-md-2">
                            <input id="authorName" name="authorName" type="text" class="form-control"
                                   placeholder="作者名">
                        </div>
                    </form>

                </div>
                <table id="exampleTable" data-mobile-responsive="true">
                </table>
            </div>
        </div>
    </div>
</div>
<!--shiro控制bootstraptable行内按钮看见性 -->
<div>
    <script type="text/javascript">
        var s_detail_h = 'hidden';
        var s_edit_h = 'hidden';
        var s_remove_h = 'hidden';
    </script>
</div>
<div shiro:hasPermission="test:order:detail">
    <script type="text/javascript">
        s_detail_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:book:edit">
    <script type="text/javascript">
        s_edit_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:book:remove">
    <script type="text/javascript">
        var s_remove_h = '';
    </script>
</div>
<div th:include="include :: footer"></div>
<script type="text/javascript" src="/js/appjs/novel/book/book.js"></script>
<script type="text/javascript">
    $(function () {
        $.get("/novel/book/listCategories", function (r) {
            if (r.code == 0 && r.data) {
                var opts = '<option value="">作品分类</option>';
                $.each(r.data, function (i, c) {
                    opts += '<option value="' + c.id + '">' + c.name + '</option>';
                });
                $('#catId').html(opts);
            }
        });
    });
</script>
</body>
</html>
